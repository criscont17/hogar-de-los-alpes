services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data

  # Base propia de GestionDeTrabajosBC: cada bounded context es dueño de sus datos.
  postgres-trabajos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trabajos_db
      POSTGRES_USER: trabajos
      POSTGRES_PASSWORD: trabajos
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trabajos -d trabajos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - trabajos_postgres_data:/var/lib/postgresql/data

  # Apache Pulsar en modo standalone para eventos y comandos entre bounded contexts.
  # Arranca siempre con datos limpios: al reiniciar un standalone en Docker su bookie
  # cambia de dirección y no puede recuperar los ledgers anteriores. Para la POC basta;
  # los servicios vuelven a crear sus suscripciones al reconectarse.
  pulsar:
    image: apachepulsar/pulsar:4.0.13
    command: ["bash", "-c", "rm -rf /pulsar/data/* && exec bin/pulsar standalone"]
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # GestionDeTrabajosBC desplegado junto a su base y Pulsar.
  gestion-trabajos:
    build: ./gestion-trabajos-service
    environment:
      DATABASE_URL: postgresql+psycopg://trabajos:trabajos@postgres-trabajos:5432/trabajos_db
      MESSAGE_BROKER: pulsar
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_CONSUMIR_COMANDOS: "true"
    ports:
      - "8001:8001"
    depends_on:
      postgres-trabajos:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

  # Segunda réplica de GestionDeTrabajosBC, solo para el experimento de escalabilidad
  # (Escenario #4): comparte la misma base y la misma suscripción `Shared` sobre
  # `comandos-trabajo` que la instancia principal, así que Pulsar reparte los comandos
  # entre ambas sin ningún cambio de código. No arranca con `docker compose up` por
  # defecto — requiere el perfil `escalabilidad`:
  #   docker compose --profile escalabilidad up -d --build gestion-trabajos-2
  #   python -m scripts.carga_escalabilidad --num 200   # correr dentro de gestion-trabajos-service
  gestion-trabajos-2:
    build: ./gestion-trabajos-service
    profiles: ["escalabilidad"]
    environment:
      DATABASE_URL: postgresql+psycopg://trabajos:trabajos@postgres-trabajos:5432/trabajos_db
      MESSAGE_BROKER: pulsar
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_CONSUMIR_COMANDOS: "true"
    ports:
      - "8004:8001"
    depends_on:
      postgres-trabajos:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

  # Base propia de OperacionesBC: partners, acuerdos comerciales y vista de sus trabajos.
  postgres-operaciones:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operaciones_db
      POSTGRES_USER: operaciones
      POSTGRES_PASSWORD: operaciones
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operaciones -d operaciones_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - operaciones_postgres_data:/var/lib/postgresql/data

  # OperacionesBC: partners B2B2C y capa anti-corrupción. Habla con GestionDeTrabajosBC
  # solo por Pulsar (comando CrearTrabajoV1 y eventos de trabajo).
  operaciones:
    build: ./operaciones-service
    environment:
      DATABASE_URL: postgresql+psycopg://operaciones:operaciones@postgres-operaciones:5432/operaciones_db
      MESSAGE_BROKER: pulsar
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_CONSUMIR_EVENTOS: "true"
    ports:
      - "8002:8002"
    depends_on:
      postgres-operaciones:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

  # Base propia de PagosBC: cada pago (cobro al cliente o pago a un proveedor) vive aquí.
  postgres-pagos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pagos_db
      POSTGRES_USER: pagos
      POSTGRES_PASSWORD: pagos
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagos -d pagos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pagos_postgres_data:/var/lib/postgresql/data

  # PagosBC: cobros al cliente (checkout) y pagos a proveedores. Consume TrabajoCerradoV1
  # de GestionDeTrabajosBC (Conformist) para liberar el pago de cada liquidación, y aísla
  # cada PSP (Wompi, PayU, MercadoPago) detrás de un adaptador con su propio circuit
  # breaker: la caída de un PSP nunca bloquea a los demás.
  pagos:
    build: ./pagos-service
    environment:
      DATABASE_URL: postgresql+psycopg://pagos:pagos@postgres-pagos:5432/pagos_db
      MESSAGE_BROKER: pulsar
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_CONSUMIR_EVENTOS_TRABAJO: "true"
    ports:
      - "8003:8003"
    depends_on:
      postgres-pagos:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wallet_postgres_data:
  trabajos_postgres_data:
  operaciones_postgres_data:
  pagos_postgres_data:
