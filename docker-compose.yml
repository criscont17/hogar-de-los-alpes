services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data

  # Base propia de GestionDeTrabajosBC: cada bounded context es dueño de sus datos.
  postgres-trabajos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trabajos_db
      POSTGRES_USER: trabajos
      POSTGRES_PASSWORD: trabajos
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trabajos -d trabajos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - trabajos_postgres_data:/var/lib/postgresql/data

  # Apache Pulsar en modo standalone para eventos y comandos entre bounded contexts.
  # Arranca siempre con datos limpios: al reiniciar un standalone en Docker su bookie
  # cambia de dirección y no puede recuperar los ledgers anteriores. Para la POC basta;
  # los servicios vuelven a crear sus suscripciones al reconectarse.
  pulsar:
    image: apachepulsar/pulsar:4.0.13
    command: ["bash", "-c", "rm -rf /pulsar/data/* && exec bin/pulsar standalone"]
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # GestionDeTrabajosBC desplegado junto a su base y Pulsar.
  gestion-trabajos:
    build: ./gestion-trabajos-service
    environment:
      DATABASE_URL: postgresql+psycopg://trabajos:trabajos@postgres-trabajos:5432/trabajos_db
      MESSAGE_BROKER: pulsar
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_CONSUMIR_COMANDOS: "true"
    ports:
      - "8001:8001"
    depends_on:
      postgres-trabajos:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

  # Base propia de OperacionesBC: partners, acuerdos comerciales y vista de sus trabajos.
  postgres-operaciones:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operaciones_db
      POSTGRES_USER: operaciones
      POSTGRES_PASSWORD: operaciones
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operaciones -d operaciones_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - operaciones_postgres_data:/var/lib/postgresql/data

  # OperacionesBC: partners B2B2C y capa anti-corrupción. Habla con GestionDeTrabajosBC
  # solo por Pulsar (comando CrearTrabajoV1 y eventos de trabajo).
  operaciones:
    build: ./operaciones-service
    environment:
      DATABASE_URL: postgresql+psycopg://operaciones:operaciones@postgres-operaciones:5432/operaciones_db
      MESSAGE_BROKER: pulsar
      PULSAR_URL: pulsar://pulsar:6650
      PULSAR_CONSUMIR_EVENTOS: "true"
    ports:
      - "8002:8002"
    depends_on:
      postgres-operaciones:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wallet_postgres_data:
  trabajos_postgres_data:
  operaciones_postgres_data:
