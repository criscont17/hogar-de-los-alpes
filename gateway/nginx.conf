# Entrada pública única de Hogar de los Alpes.
#
# Cada bounded context queda publicado bajo su prefijo, y el prefijo se quita antes de
# reenviar la petición:
#
#   /wallet/billeteras             → wallet:8000/billeteras
#   /trabajos/trabajos             → gestion-trabajos:8001/trabajos
#   /operaciones/partners          → operaciones:8002/partners
#   /pagos/pagos                   → pagos:8003/pagos
#
# Cada servicio arranca con UVICORN_ROOT_PATH igual a su prefijo, para que Swagger
# (/wallet/docs, /trabajos/docs, ...) funcione detrás del gateway.

# DNS interno de Docker, consultado en cada petición (proxy_pass con variable). Así el
# gateway arranca aunque falte un servicio, y al reconstruir uno (cambia de IP) no queda
# apuntando al contenedor anterior.
resolver 127.0.0.11 valid=10s ipv6=off;

# Conserva el esquema original si la VM queda detrás de un balanceador de AWS con TLS.
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $esquema_original;

    # Un servicio caído o inexistente responde JSON en vez de la página de Nginx.
    error_page 502 503 504 = @no_disponible;

    location = / {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 200 '{"servicio":"Hogar de los Alpes - entrada pública","contextos":{"WalletBC":"/wallet/docs","GestionDeTrabajosBC":"/trabajos/docs","OperacionesBC":"/operaciones/docs","PagosBC":"/pagos/docs"}}';
    }

    location = /salud {
        access_log off;
        default_type application/json;
        return 200 '{"estado":"ok"}';
    }

    # --- WalletBC -----------------------------------------------------------------
    location = /wallet { return 301 /wallet/docs; }
    location = /wallet/ { return 301 /wallet/docs; }
    location /wallet/ {
        set $destino http://wallet:8000;
        rewrite ^/wallet(/.*)$ $1 break;
        proxy_pass $destino;
    }

    # --- GestionDeTrabajosBC ------------------------------------------------------
    location = /trabajos { return 301 /trabajos/docs; }
    location = /trabajos/ { return 301 /trabajos/docs; }
    location /trabajos/ {
        set $destino http://gestion-trabajos:8001;
        rewrite ^/trabajos(/.*)$ $1 break;
        proxy_pass $destino;
    }

    # --- OperacionesBC ------------------------------------------------------------
    location = /operaciones { return 301 /operaciones/docs; }
    location = /operaciones/ { return 301 /operaciones/docs; }
    location /operaciones/ {
        set $destino http://operaciones:8002;
        rewrite ^/operaciones(/.*)$ $1 break;
        proxy_pass $destino;
    }

    # --- PagosBC ------------------------------------------------------------------
    location = /pagos { return 301 /pagos/docs; }
    location = /pagos/ { return 301 /pagos/docs; }
    location /pagos/ {
        set $destino http://pagos:8003;
        rewrite ^/pagos(/.*)$ $1 break;
        proxy_pass $destino;
    }

    location @no_disponible {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 503 '{"detalle":"El servicio no está disponible en este momento"}';
    }

    location / {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 404 '{"detalle":"Ruta no publicada en la entrada pública"}';
    }
}
